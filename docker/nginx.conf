server {
    listen 80;
    server_name _;

    # Sem limite de tamanho para upload de backups
    client_max_body_size 0;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Tudo que começa com /api/ vai para a API (o prefixo /api é removido)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
